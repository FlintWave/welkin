[package]
name = "welkin-msg-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
aurora-msg = { git = "https://github.com/Aurora-Viewer/Aurora-Viewer", rev = "3d523b14a17bbc6484b208378c0eef291ad5ac32" }
aurora-net = { git = "https://github.com/Aurora-Viewer/Aurora-Viewer", rev = "3d523b14a17bbc6484b208378c0eef291ad5ac32" }
glam = "0.34.1"
uuid = { version = "1.27.0", features = ["v4"] }

[[bin]]
name = "fuzz_parse_packet"
path = "fuzz_targets/fuzz_parse_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_object_updates"
path = "fuzz_targets/fuzz_object_updates.rs"
test = false
doc = false
bench = false

[workspace]
