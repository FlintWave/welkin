[package]
name = "opensim-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "osim-conform"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
axum = { workspace = true }
glam = { workspace = true }
rapier3d = { workspace = true }
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = "1"
uuid = { workspace = true }

[dev-dependencies]
aurora-llsd = { workspace = true }
aurora-msg = { workspace = true }
aurora-net = { workspace = true }
opensim-llsd = { path = "../opensim-llsd" }
opensim-data = { path = "../opensim-data" }
opensim-services = { path = "../opensim-services" }
sqlx = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
md5 = "0.7"
base64 = { workspace = true }
quick-xml = "0.37"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }

[lints]
workspace = true
