# SPDX-License-Identifier: LGPL-3.0-or-later
#
# Standalone crate — not part of the workspace (Tauri has its own toolchain needs).
# Build with: cargo tauri build   (from this directory)

[package]
name = "welkin-companion"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "Desktop companion for OpenSimulator grid portal"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "fs", "io-util"] }
open = "5"

[build-dependencies]
tauri-build = "2"
