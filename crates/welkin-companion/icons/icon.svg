<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2c5f8a;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <!-- Grid lines representing the virtual world grid -->
  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="1">
    <line x1="32" y1="24" x2="32" y2="104"/>
    <line x1="64" y1="24" x2="64" y2="104"/>
    <line x1="96" y1="24" x2="96" y2="104"/>
    <line x1="24" y1="40" x2="104" y2="40"/>
    <line x1="24" y1="64" x2="104" y2="64"/>
    <line x1="24" y1="88" x2="104" y2="88"/>
  </g>
  <!-- Globe/world symbol -->
  <circle cx="64" cy="64" r="28" fill="none" stroke="#ffffff" stroke-width="3"/>
  <ellipse cx="64" cy="64" rx="14" ry="28" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="36" y1="64" x2="92" y2="64" stroke="#ffffff" stroke-width="2"/>
  <!-- Small dot at center -->
  <circle cx="64" cy="64" r="4" fill="#ffffff"/>
</svg>
