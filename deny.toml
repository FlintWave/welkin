[graph]
all-features = false
no-default-features = false

[advisories]
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 timing side-channel; in sqlx-mysql dep chain, awaiting sqlx update to rsa 0.10" },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys CVE-2026-119375; sqlx 0.8 pins 0.30.x, fix needs sqlx upgrade to rusqlite 0.41" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; in rapier3d dep chain via simba/nalgebra, no upgrade path" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/Aurora-Viewer/Aurora-Viewer"]
