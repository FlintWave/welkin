# cargo-deny configuration for welkin
# Project licence: GPL-3.0-or-later
# Run: cargo deny check

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 timing side-channel; in sqlx-mysql dep chain, awaiting sqlx update to rsa 0.10" },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys CVE-2026-119375; sqlx 0.8 pins 0.30.x, fix needs sqlx upgrade to rusqlite 0.41" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml <0.41.0; upgrade blocked by welkin-scene pinning 0.37.x" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml <0.41.0; upgrade blocked by welkin-scene pinning 0.37.x" },
]

[licenses]
# All licences here are confirmed GPLv3-compatible.
# See docs/licence-audit.md for the full analysis.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

# ring bundles code under ISC (BoringSSL), MIT, and OpenSSL licences.
# The Cargo.toml SPDX expression does not capture the OpenSSL component,
# so we clarify it here against the LICENSE file hash.
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/Aurora-Viewer/Aurora-Viewer"]
