[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["crates/welkin-companion"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Aurora Viewer crates, pinned to a known commit (unpublished, wrapped — never use directly)
aurora-llsd = { git = "https://github.com/Aurora-Viewer/Aurora-Viewer", rev = "3d523b14a17bbc6484b208378c0eef291ad5ac32" }
aurora-msg = { git = "https://github.com/Aurora-Viewer/Aurora-Viewer", rev = "3d523b14a17bbc6484b208378c0eef291ad5ac32" }
aurora-prim = { git = "https://github.com/Aurora-Viewer/Aurora-Viewer", rev = "3d523b14a17bbc6484b208378c0eef291ad5ac32" }
aurora-assets = { git = "https://github.com/Aurora-Viewer/Aurora-Viewer", rev = "3d523b14a17bbc6484b208378c0eef291ad5ac32" }
aurora-net = { git = "https://github.com/Aurora-Viewer/Aurora-Viewer", rev = "3d523b14a17bbc6484b208378c0eef291ad5ac32" }

# Common dependencies
glam = "0.34.1"
thiserror = "2.0.21"
base64 = "0.23.1"
bitflags = "2.9"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "sqlite", "any"] }
rapier3d = { version = "0.36.1", features = ["enhanced-determinism", "serde-serialize"] }
clap = { version = "4", features = ["derive"] }
configparser = "3"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
tempfile = "3"
mlua = { version = "0.12", features = ["luau", "serialize", "send"] }
parking_lot = "0.12"
sha1_smol = { version = "1", features = ["std"] }
md-5 = "0.10"
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
tiny-skia = "0.11"
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
hmac = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
