[package]
name = "lsl-test-runner"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
welkin-script-compiler = { path = "../../../crates/welkin-script-compiler" }
welkin-script-vm = { path = "../../../crates/welkin-script-vm" }
parking_lot = "0.12"
mlua = { version = "0.12", features = ["luau", "serialize", "send"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
